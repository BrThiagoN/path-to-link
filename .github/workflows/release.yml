name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Installer regression tests
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test installer checksum handling
        shell: pwsh
        run: ./tests/install-checksum.ps1

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: path-to-link
            asset: path-to-link-x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: path-to-link
            asset: path-to-link-aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: path-to-link
            asset: path-to-link-x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            binary: path-to-link
            asset: path-to-link-aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: path-to-link.exe
            asset: path-to-link-x86_64-pc-windows-msvc.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: path-to-link.exe
            asset: path-to-link-aarch64-pc-windows-msvc.exe

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Stage binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$BINARY" "dist/$ASSET"

      - name: Create SHA-256 checksum
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $assetPath = "dist/$($env:ASSET)"
          $checksumPath = "$assetPath.sha256"
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$hash  $env:ASSET" -Encoding ascii

      - name: Create SHA-256 checksum
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum "dist/$ASSET" | awk '{print $1}')
          else
            hash=$(shasum -a 256 "dist/$ASSET" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$hash" "$ASSET" > "dist/$ASSET.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: path-to-link-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e9fe4098bad09cb42c3dec7187f15861fc # v7.0.1

      - name: Download platform builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: path-to-link-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Path-to-Link $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
