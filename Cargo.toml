[package]
name = "path-to-link"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Temporary local file links for developer tools and AI agents"
license = "MIT"
repository = "https://github.com/BrThiagoN/path-to-link"

[[bin]]
name = "ptl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.0", features = ["fs", "io-std", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.6", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
